name: CI

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: media-proxy-addon

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  launcher:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: python3 -m unittest discover -s tests -v

  init:
    runs-on: ubuntu-latest
    name: Initialize builds
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Get build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    needs: init
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.arch }} add-on
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Get build configuration
        id: config
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          echo "build_from=$(yq ".build_from.${ARCH}" build.yaml)" >> $GITHUB_OUTPUT
          echo "app_repo=$(yq '.args.APP_REPO' build.yaml)" >> $GITHUB_OUTPUT
          echo "app_ref=$(yq '.args.APP_REF' build.yaml)" >> $GITHUB_OUTPUT

      - name: Build add-on
        uses: home-assistant/builder/actions/build-image@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          cosign: "false"
          image: ${{ matrix.image }}
          image-tags: test
          push: "false"
          load: "true"
          version: test
          build-args: |
            BUILD_FROM=${{ steps.config.outputs.build_from }}
            APP_REPO=${{ steps.config.outputs.app_repo }}
            APP_REF=${{ steps.config.outputs.app_ref }}

      - name: Verify installed runtime and launch with existing options
        env:
          IMAGE: ${{ matrix.image }}
        run: python3 tests/smoke_container.py "$IMAGE:test"
